<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; media-src https: blob:; object-src 'none'; base-uri 'none'"
    />
    <title>YouTube English Learner</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/views.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar" id="titlebar">
        <div class="titlebar__brand">
          <span class="titlebar__logo" aria-hidden="true">▶</span>
          <span class="titlebar__text">YouTube English Learner</span>
        </div>
        <div class="titlebar__spacer"></div>
        <div class="titlebar__controls">
          <button class="wbtn" type="button" data-window="minimize" title="최소화">－</button>
          <button class="wbtn" type="button" data-window="maximize" title="최대화/복원">▢</button>
          <button class="wbtn wbtn--close" type="button" data-window="close" title="닫기">✕</button>
        </div>
      </header>
      <div class="shell">
        <aside class="sidebar">
          <nav class="nav" id="nav" aria-label="주요 메뉴"></nav>
          <div class="tip-card">
            <p class="tip-card__label">오늘의 한마디</p>
            <p class="tip-card__text">"Small steps make big progress."</p>
          </div>
        </aside>
        <main class="content" id="content" tabindex="-1"></main>
      </div>
      <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
      <div id="modal-root"></div>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
